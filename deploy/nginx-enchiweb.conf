# nginx site for enchiweb. The Node app (PM2, 127.0.0.1:3000) serves EVERYTHING:
# pages, /assets (CSS/JS), public files, /img (optimised images) and /api.
# So nginx only proxies. Don't add `root /var/www/html`, `try_files`, or
# `location ~* \.(css|js|png|…)$` blocks: they make nginx look for those files
# on disk, where they don't exist, and break styles and images.
#
# Install:
#   sudo cp deploy/nginx-enchiweb.conf /etc/nginx/sites-available/enchiweb
#   sudo ln -s /etc/nginx/sites-available/enchiweb /etc/nginx/sites-enabled/enchiweb
#   sudo rm -f /etc/nginx/sites-enabled/default     # the stock site serves /var/www/html
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d enchicoe.edu.gh -d www.enchicoe.edu.gh   # HTTPS

server {
  listen 80;
  listen [::]:80;
  server_name enchicoe.edu.gh www.enchicoe.edu.gh;

  # Admin API bodies (rich text) can be large; file uploads go straight to R2.
  client_max_body_size 10m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The first request for a new image size can take a few seconds.
    proxy_read_timeout 60s;
  }
}
